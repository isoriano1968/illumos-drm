[package]
name = "virtio_gpu"
description = "A DRM driver for the virtio GPU device: 2D scanout, cursor, and virgl 3D through the host's virglrenderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# The kernel module: the ddi panic handler and global allocator. Host unit
# tests of the pure logic build without them (--no-default-features),
# because std brings its own.
default = ["kernel"]
kernel = ["ddi/panic-handler", "ddi/global-alloc-sleep"]

[dependencies]
# global-alloc-sleep: this driver's context and capability-set tables and
# its display layout use alloc; every allocation happens in thread context
# (ioctls, attach, the virtio task queue, the facade's hooks).
# unstable-gate-cda5b9a49f-virtio: the virtio framework (misc/virtio), a
# private interface checked against illumos cda5b9a49f.
ddi = { workspace = true, features = ["unstable-gate-cda5b9a49f-virtio"] }
# The DRM core is the module misc/drm_core; the driver uses it through the
# facade (drm-facade-sys brings -N misc/drm_core).
drm-facade.workspace = true
drm-uapi.workspace = true

[package.metadata.kmod]
# Install class: /kernel/drv/amd64/virtio_gpu; bound to pci1af4,1050 by
# /etc/driver_aliases (add_drv -i), no .conf file.
class = "drv"
depends = []
