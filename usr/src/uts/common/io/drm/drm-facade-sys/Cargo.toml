[package]
name = "drm-facade-sys"
description = "Raw bindings to the DRM facade of illumos-drm: the C interface of the kernel module misc/drm_core, generated from usr/src/uts/common/drm"
version.workspace = true
edition.workspace = true
# The bindings are generated from the MIT-licensed facade headers.
license = "MIT"
repository.workspace = true
rust-version.workspace = true

[dependencies]

[package.metadata.kmod]
# The functions resolve from misc/drm_core (usr/src/uts/common/io/drm/drm_core), so every driver that
# uses the facade names it with -N; drivers linked with -z defs add the
# facade's mapfile (generated from the same headers).
depends = ["misc/drm_core"]
local-mapfiles = ["usr/src/uts/common/drm/drm_facade.mapfile"]
