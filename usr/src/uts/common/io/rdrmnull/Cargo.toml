[package]
name = "rdrmnull"
description = "A DRM null driver: one device with card and render nodes, GEM objects and dumb buffers in system memory and no hardware, for testing the core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# global-alloc-sleep: the driver's own boxes and vectors (KM_SLEEP, thread
# context only).
ddi = { workspace = true, features = ["panic-handler", "global-alloc-sleep"] }
# The DRM core is the module misc/drm_core; the driver uses it through the
# facade (drm-facade-sys brings -N misc/drm_core).
drm-facade.workspace = true
drm-uapi.workspace = true

[package.metadata.kmod]
# Install class: /usr/kernel/drv/amd64/rdrmnull
class = "drv"
conf = "rdrmnull.conf"
depends = []
