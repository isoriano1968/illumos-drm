# i915n attach-time display recovery policy (integer properties).
# Defaults: display enabled for every GPU admitted by the port.
# These settings do not bypass the unsupported-GPU probe guard.
#
# Force headless on all i915n devices:
# i915n-force-no-display=1;
#
# Force headless on particular PCI device IDs (not vendor IDs):
# i915n-no-display-device-ids=0x1916,0x1926;
#
# Force headless on graphics generations (GRAPHICS_VER, integers):
# 6 Sandy Bridge; 7 Ivy Bridge/Haswell; 8 Broadwell; 9 SKL/KBL/CFL/CML.
# i915n-no-display-generations=9;
#
# For one device instance, place i915n-force-no-display=1 in a device
# specification with its observed name, parent path and unit-address;
# see driver.conf(5). Do not guess the PCI path from another machine.
# Apply in a disposable BE, update its boot archive and reboot.
# Headless also disables the i915n console: retain SSH/serial access and
# the original BE. It is not a promise to preserve the boot framebuffer.
