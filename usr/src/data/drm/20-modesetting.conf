#
# Installed by drmadm(8) only for the new stack selected since this boot.
# Generic to i915n and virtio_gpu; the package template is outside Xorg's
# search paths. drmadm preserves administrator-created or changed files.
Section "Device"
	Identifier	"illumos-drm"
	Driver		"modesetting"
	Option		"kmsdev"	"/dev/dri/card0"
	Option		"AccelMethod"	"glamor"
EndSection
