#
# rdrmnull DMA drill, a test aid for drm_dma_errno_test.c: as
# rdrmnull-dma-self.conf (the driver's own node under the root nexus), but
# with the largest DMA transfer lowered to one page, so that the root nexus
# refuses to bind any larger object (DDI_DMA_TOOBIG, as the core never asks
# for a partial mapping). The root nexus logs that refusal once per boot
# and driver, as expected here: "WARNING: rdrmnull: coding error detected,
# the driver is using ddi_dma_attr(9S) incorrectly" (rootnex_bind_warn).
# Such a node keeps its /etc/path_to_inst entry after rem_drv; use a
# disposable VM.
#
name="rdrmnull" parent="/" instance=0 reg=0,0,0 dma-mode="self" dma-max-transfer=4096;
