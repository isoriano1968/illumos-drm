# rdrmnull DMA drill, a test aid (RDRMNULL_CONF for run-r1-test.sh):
# attach under the root nexus, which does DMA, and bind every GEM object
# against the driver's own node. The root nexus names the child after its
# "reg" (rdrmnull@0,0). Such a node keeps its /etc/path_to_inst entry after
# rem_drv; use a disposable VM.
#
name="rdrmnull" parent="/" instance=0 reg=0,0,0 dma-mode="self";
