# Solstice CI (Forgejo Actions), set up like illumos-ddi's workflow.
# Constraints of the runner: no `uses:`, no `needs:`, no `if:`, no
# artifacts; steps run as `sh -lc`; the runner clones the repository at the
# pushed commit before the first step and runs every step from its root.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-hosted:
    # Type-check, lint, format-check, document and run the host tests
    # against the hosted illumos target. The toolchain pinned in
    # rust-toolchain.toml goes into a private rustup in $HOME.
    runs-on: rust
    steps:
      - run: >
          curl -sSf https://sh.rustup.rs | env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          sh -s -- -y --profile minimal --default-toolchain none --no-modify-path &&
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 &&
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo check --workspace --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo clippy --workspace --target x86_64-unknown-illumos -- -D warnings
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo fmt --all -- --check
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude xtask --no-deps --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo test -p drm-core -p drm-uapi -p drm-facade && cargo test -p virtio_gpu --no-default-features
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo xtask uapi-check tools/uapi/drm_layout.oibldofgate.out
      # The facade's layouts in Rust (drm-facade-sys) against gcc's on
      # illumos (tools/facade/facade_layout.c compiled with gcc -S).
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo xtask facade-check tools/facade/facade_layout.illumos.out
      # The files generated from the facade headers (both mapfiles, the
      # layout program, xtask's table) match bindings.rs; with bindgen and
      # ILLUMOS_GATE the script regenerates bindings.rs from the headers too.
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && sh tools/facade/check-generated.sh

  kmod-illumos:
    # Native illumos: install the pinned nightly (the only nightly-only step
    # is -Zbuild-std), build the modules for the kernel target and link them
    # with the illumos ld as real kernel modules.
    runs-on: illumos
    steps:
      - run: >
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          --default-toolchain nightly-2026-04-16 --component rust-src --no-modify-path
      # The facade's layouts as this machine's gcc compiles the headers,
      # against drm-facade-sys.
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && mkdir -p target &&
          gcc -m64 -D_KERNEL -std=gnu99 -I include -S -o - tools/facade/facade_layout.c |
          sed -n 's/^.*@@ //p' | tr -d '"' > target/facade-gcc.out &&
          cargo +nightly-2026-04-16 xtask facade-check target/facade-gcc.out
      # misc/drm_core, the DRM core and the C facade: linked with drm_core.mapfile,
      # which must leave exactly _init, _fini, _info and the facade's
      # functions global (-B reduce), with the facade's CTF where the
      # gate's ctfconvert is installed (developer/build/onbld).
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && export SCCACHE_STARTUP_TIMEOUT=60 &&
          cargo +nightly-2026-04-16 build --locked -p drm-module --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
      - run: >
          ctf= &&
          if [ -x /opt/onbld/bin/i386/ctfconvert ]; then
          OUT=target modules/drm_core/ctf/build-ctf.sh && ctf="-z defaultextract target/drm_facade_ctf.o";
          else echo "no ctfconvert: misc/drm_core without CTF"; fi &&
          ld -ztype=kmod -N fs/specfs -B reduce -M modules/drm_core/drm_core.mapfile -z allextract
          target/x86_64-illumos-kmod/release/drm_module.a $ctf -o target/drm_core &&
          elfdump -d target/drm_core | grep SUNW_KMOD && nm -u target/drm_core &&
          nm target/drm_core | awk -F'|' '$5 ~ /GLOB/ && $7 !~ /UNDEF/ {gsub(/ /, "", $8); print $8}' | sort > target/drm_core.globals &&
          awk '/global:/ {g=1; next} /local:/ {g=0} g && /;/ {gsub(/[;\t ]/, ""); print}' modules/drm_core/drm_core.mapfile | sort > target/drm_core.want &&
          diff target/drm_core.want target/drm_core.globals && echo "misc/drm_core: $(wc -l < target/drm_core.globals) global symbols, as drm_core.mapfile"
      # The Rust drivers, linked against misc/drm_core (-N misc/drm_core). Neither may
      # carry a symbol of drm-core's stateful modules, which only misc/drm_core
      # builds (feature "kernel"): the core runs once, in misc/drm_core.
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && export SCCACHE_STARTUP_TIMEOUT=60 &&
          cargo +nightly-2026-04-16 build --locked -p rdrmnull --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem &&
          cargo +nightly-2026-04-16 build --locked -p virtio_gpu --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
      - run: >
          ld -ztype=kmod -N fs/specfs -N misc/drm_core -z allextract
          target/x86_64-illumos-kmod/release/rdrmnull.a -o target/rdrmnull &&
          ld -ztype=kmod -N misc/virtio -N fs/specfs -N misc/drm_core -z allextract
          target/x86_64-illumos-kmod/release/virtio_gpu.a -o target/virtio_gpu &&
          . tools/test/drm-test-lib.sh &&
          n=$(core_symbols target/x86_64-illumos-kmod/release/drm_module.a | wc -l) &&
          echo "drm_module.a: $n stateful core symbols (the pattern's control)" && test "$n" -gt 0 &&
          for m in rdrmnull virtio_gpu; do
          elfdump -d target/$m | grep SUNW_KMOD && nm -u target/$m &&
          core_symbols target/$m > target/$m.core &&
          echo "$m: $(wc -l < target/$m.core) stateful core symbols" && head target/$m.core &&
          test ! -s target/$m.core || exit 1; done
      # The system headers the C builds use (target/sysinc): /usr/include,
      # with OpenIndiana's libdrm uAPI headers (developer/header-drm) from
      # gfx-drm at the commit OpenIndiana ships (MIT) when the runner image
      # lacks them.
      - run: >
          mkdir -p target/sysinc && for f in /usr/include/*; do ln -sfn "$f" target/sysinc/; done &&
          if [ ! -f /usr/include/drm/drm.h ]; then rm -rf target/sysinc/drm && mkdir target/sysinc/drm &&
          for h in drm.h drm_mode.h; do curl -sSf -o target/sysinc/drm/$h
          https://raw.githubusercontent.com/OpenIndiana/gfx-drm/d109414c4f/usr/src/uts/common/drm/$h || exit 1; done; fi &&
          ls -l target/sysinc/drm/drm.h
      # cdrmnull, the C driver: gcc with the gate's kernel flags, linked
      # with -N misc/drm_core -z defs against the gate's ddi.mapfile (of the
      # gate commit ddi-sys is pinned to), the facade's mapfile and its
      # private.mapfile.
      - run: >
          curl -sSf -o target/ddi.mapfile
          https://raw.githubusercontent.com/illumos/illumos-gate/cda5b9a49f77a86a151a20cdde0e948a49b37160/usr/src/uts/common/mapfiles/ddi.mapfile &&
          SYSINC=$PWD/target/sysinc DDI_MAPFILE=target/ddi.mapfile OUT=target/cdrmnull drivers/cdrmnull/build.sh &&
          elfdump -d target/cdrmnull/cdrmnull | grep SUNW_KMOD
      # misc/linuxkpi, the Linux compatibility layer (linuxkpi/), and its
      # test driver linuxkpi_selftest: gcc with the gate's kernel flags and
      # the Linux dialect (linuxkpi/kflags.sh), -z defs against the gate's
      # ddi.mapfile, the facade's mapfile and the layer's private.d.
      - run: >
          SYSINC=$PWD/target/sysinc DDI_MAPFILE=target/ddi.mapfile OUT=target/linuxkpi linuxkpi/build.sh all &&
          elfdump -d target/linuxkpi/linuxkpi | grep NEEDED &&
          elfdump -d target/linuxkpi/linuxkpi_selftest | grep NEEDED
      # misc/drm_helpers, the carried Linux helpers (carried/), and its test
      # driver: the vendored Linux files against their pinned SHA-256, the
      # layer's flags, -z defs against the gate's ddi.mapfile and
      # linuxkpi.mapfile; the module's global symbols must be exactly
      # drm_helpers_scope.mapfile's, and the test driver links with
      # -N misc/drm_helpers against drm_helpers.mapfile only.
      - run: >
          SYSINC=$PWD/target/sysinc DDI_MAPFILE=target/ddi.mapfile OUT=target/carried
          LKPI_MAPFILE=target/linuxkpi/linuxkpi.mapfile carried/build.sh &&
          elfdump -d target/carried/drm_helpers | grep NEEDED &&
          elfdump -d target/carried/drm_helpers_test | grep NEEDED
      # The i915n link gate: the vendored Linux tree with the illumos
      # changes, every Linux input licence-checked, all TUs
      # compiled with the layer's flags (any failure fails the step) and
      # linked with -z defs against the facade, layer, helpers and DDI.
      - run: >
          SYSINC=$PWD/target/sysinc DDI_MAPFILE=target/ddi.mapfile
          LKPI_MAPFILE=target/linuxkpi/linuxkpi.mapfile OUT=target/i915 JOBS=4
          drivers/i915/build.sh all &&
          elfdump -d target/i915/i915n | grep NEEDED
      # misc/drm_kms, Linux's KMS code (carried/drm_kms), from the same
      # vendored tree: its TUs licence-checked and
      # compiled (any failure fails the step), the exports equal to the
      # committed drm_kms.mapfile (which i915n links against), linked with
      # -z defs against the core, layer, helpers and DDI, and the module's
      # global symbols exactly the exports.
      - run: >
          SYSINC=$PWD/target/sysinc DDI_MAPFILE=target/ddi.mapfile
          LKPI_MAPFILE=target/linuxkpi/linuxkpi.mapfile OUT=target/drm_kms JOBS=4
          carried/drm_kms/build.sh all &&
          elfdump -d target/drm_kms/drm_kms | grep NEEDED
      # The layer's host tests (trees, xarray/IDR, bitmaps, lists, refcount,
      # printf, strings) and the carried helpers' as userland programs.
      - run: CC=gcc linuxkpi/tests/host/host-test.sh
      - run: CC=gcc carried/host-test.sh
