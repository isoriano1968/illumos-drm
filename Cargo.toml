[workspace]
resolver = "3"
members = [
    "usr/src/uts/common/io/drm/drm-uapi",
    "usr/src/uts/common/io/drm/drm-facade-sys",
    "usr/src/uts/common/io/drm/drm-core",
    "usr/src/uts/common/io/drm/drm-facade",
    "usr/src/uts/common/io/drm/drm_core",
    "usr/src/uts/common/io/rdrmnull",
    "usr/src/uts/common/io/virtio_gpu",
    "usr/src/tools/xtask",
]
default-members = [
    "usr/src/uts/common/io/drm/drm-uapi",
    "usr/src/uts/common/io/drm/drm-facade-sys",
    "usr/src/uts/common/io/drm/drm-core",
    "usr/src/uts/common/io/drm/drm-facade",
    "usr/src/uts/common/io/drm/drm_core",
    "usr/src/uts/common/io/rdrmnull",
    "usr/src/uts/common/io/virtio_gpu",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/illumos/illumos-drm"
rust-version = "1.97"

[workspace.dependencies]
drm-uapi = { path = "usr/src/uts/common/io/drm/drm-uapi" }
drm-core = { path = "usr/src/uts/common/io/drm/drm-core", default-features = false }
drm-facade = { path = "usr/src/uts/common/io/drm/drm-facade" }
drm-facade-sys = { path = "usr/src/uts/common/io/drm/drm-facade-sys" }
# illumos-ddi at its main branch, which holds the merged pull requests
# 4 to 9 (r3-kms-glue, r2-private-fd, r4-virtio, g1-gate-pin,
# r5a-char-table, g7-module-busy): clone opens, the devmap(9E) entry
# point, OwnNode, chpoll(9E), the private tier for dma-bufs, sync objects
# and sync files, PollBox, the virtio framework (feature
# unstable-gate-cda5b9a49f-virtio, checked at illumos 7e802e88a3), the
# CharTable glue, the cb_ops: form of module!, Driver::load and
# module_loaded.
ddi-sys = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "e82e75d406275cb4a0bf5c23e294d87c37a9a96c" }
ddi = { git = "https://code.aopc.cloud/illumos/illumos-ddi.git", rev = "e82e75d406275cb4a0bf5c23e294d87c37a9a96c", default-features = false }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1

