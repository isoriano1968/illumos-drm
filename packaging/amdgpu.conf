#
# amdgpu driver configuration.
#
# Keep every amdgpu instance attached: illumos detaches idle driver
# instances during boot, and nothing opens a GPU that only computes.
# amdgpu's teardown is not safe to run then (on the Mac Pro 2013 it
# switches the machine off).
ddi-no-autodetach=1;
